<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // 1. CHOOSE YOUR LINKS HERE:
        var desktopUrl = "https://inkr-app.my.canva.site"; 
        var mobileUrl  = "https://inkr-mobile.my.canva.site";

        // 2. DEVICE CHECKER:
        // Checks if screen width is under 768px OR matches touch screen signatures
        var isMobile = (window.innerWidth <= 768) || 
                       (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));

        // 3. EXECUTE REDIRECT:
        if (isMobile) {
            window.location.replace(mobileUrl);
        } else {
            window.location.replace(desktopUrl);
        }
    </script>
    
    <!-- Fallback if the user has JavaScript turned off completely (Defaults to Desktop) -->
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://inkr-app.my.canva.site">
    </noscript>
</head>
<body>
    <p>Loading the best version for your device...</p>
</body>
</html>
